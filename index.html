<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Book Tracker PWA</title>
  <link rel="manifest" href="manifest.json">
  <!-- Библиотека для сканирования штрих-кодов -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --bg: #0f1117; --surface: #1a1d26; --primary: #4CAF50; --text: #fff; --text2: #888; --border: #333; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 20px; }
    
    /* Шапка */
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    header span { font-weight: 600; font-size: 18px; }
    .btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 4px; }
    .add-btn { background: var(--primary); width: 36px; height: 36px; border-radius: 50%; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }

    /* Боковое меню */
    #sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--surface); transition: 0.3s; z-index: 20; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
    #sidebar.open { left: 0; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 15; display: none; }
    #overlay.open { display: block; }

    /* Профиль в меню */
    .profile { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
    .avatar-wrap { position: relative; cursor: pointer; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2a2d36; object-fit: cover; border: 2px solid var(--primary); }
    .avatar-badge { position: absolute; bottom: 0; right: 0; background: var(--primary); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid var(--surface); }
    .profile-text h2 { margin: 0; font-size: 16px; cursor: pointer; }
    .profile-text span { font-size: 12px; color: var(--text2); }

    /* Вкладки */
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab { flex: 1; text-align: center; padding: 10px; background: #222; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .tab.active { background: var(--primary); color: #fff; font-weight: 500; }

    /* Настройки */
    .settings { margin-top: 10px; }
    .settings h3 { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .toggle-row input { accent-color: var(--primary); transform: scale(1.2); cursor: pointer; }

    /* Статистика */
    .stats { display: flex; gap: 10px; margin: 0 16px 15px; padding: 12px; background: #151820; border-radius: 10px; transition: all 0.2s; }
    .stats.hidden { display: none; }
    .stat { flex: 1; text-align: center; }
    .stat div { font-size: 12px; color: var(--text2); }
    .stat span { font-size: 18px; font-weight: bold; color: var(--primary); display: block; margin-top: 4px; }

    /* Список книг */
    .list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .book { display: flex; gap: 12px; background: var(--surface); padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .book img { width: 70px; height: 100px; object-fit: cover; border-radius: 6px; background: #222; }
    .book-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .book-info h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.2; }
    .book-info .meta { font-size: 13px; color: var(--text2); }
    .book-info .price { font-size: 13px; color: var(--primary); font-weight: 600; transition: opacity 0.2s; }
    .book-info .price.hidden { display: none; }
    .book-info .desc { font-size: 12px; color: #666; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Модальное окно */
    .modal { position: fixed; inset: 0; background: var(--bg); z-index: 30; padding: 20px; overflow-y: auto; display: none; }
    .modal.open { display: block; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 5px; }
    #reader { width: 100%; margin-bottom: 10px; background: #111; border-radius: 8px; overflow: hidden; }
    .scan-btn { width: 100%; padding: 10px; background: #2a2d36; color: var(--primary); border: 1px dashed var(--primary); border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
    .file-label { display: inline-block; padding: 8px 12px; background: #222; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #coverPreview { max-height: 80px; border-radius: 4px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>

  <header>
    <button class="btn" onclick="toggleSidebar()">☰</button>
    <span>Book Tracker PWA</span>
    <button class="add-btn" onclick="openModal()">+</button>
  </header>

  <div id="overlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="profile">
      <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
        <img id="userAvatar" class="avatar" src="https://via.placeholder.com/48/4CAF50/FFFFFF?text=U">
        <div class="avatar-badge">📷</div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      </div>
      <div class="profile-text">
        <h2 id="userName" onclick="editName()">Book Tracker</h2>
        <span id="userStatus">online</span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('personal')">Личная библиотека</div>
      <div class="tab" onclick="switchTab('all')">Вся библиотека</div>
    </div>

    <div class="settings">
      <h3>Настройки отображения</h3>
      <div class="toggle-row">
        <span>Показывать цену на карточках</span>
        <input type="checkbox" id="togglePrice" checked>
      </div>
      <div class="toggle-row">
        <span>Показывать статистику</span>
        <input type="checkbox" id="toggleStats" checked>
      </div>
    </div>
  </div>

  <div id="statsSection" class="stats">
    <div class="stat"><div>Книг</div><span id="statCount">0</span></div>
    <div class="stat"><div>Потрачено</div><span id="statSum">0 ₽</span></div>
  </div>

  <div id="bookList" class="list"></div>

  <!-- Модалка добавления -->
  <div id="modal" class="modal">
    <div class="modal-header">
      <h2>Добавить книгу</h2>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    
    <button class="scan-btn" onclick="startScan()">📷 Сканировать штрих-код</button>
    <div id="reader"></div>
    <input type="text" id="mIsbn" placeholder="Или введите ISBN вручную" oninput="fetchBookData(this.value)">

    <label>Название</label><input type="text" id="mTitle">
    <label>Автор</label><input type="text" id="mAuthor">
    <label>Описание</label><textarea id="mDesc" rows="3"></textarea>
    <label>Цена покупки (₽)</label><input type="number" id="mPrice" step="0.01" min="0">
    <label>Обложка (ссылка)</label><input type="url" id="mCoverUrl" placeholder="https://...">
    <label>Или загрузить фото</label>
    <input type="file" id="mCoverFile" accept="image/*" hidden onchange="previewCover(this)">
    <button class="file-label" onclick="document.getElementById('mCoverFile').click()">📷 Выбрать / Сделать фото</button>
    <img id="coverPreview">
    
    <button class="btn-submit" onclick="saveBook()">Сохранить книгу</button>
  </div>

  <script>
    // --- Данные и настройки ---
    let books = JSON.parse(localStorage.getItem('books') || '[]');
    let settings = JSON.parse(localStorage.getItem('settings') || '{"showPrice":true,"showStats":true}');
    let profile = JSON.parse(localStorage.getItem('profile') || '{"name":"Book Tracker","avatar":"https://via.placeholder.com/48/4CAF50/FFFFFF?text=U"}');
    let currentTab = 'personal';
    let html5QrcodeScanner = null;
    let coverBase64 = null;

    // Инициализация интерфейса
    document.getElementById('togglePrice').checked = settings.showPrice;
    document.getElementById('toggleStats').checked = settings.showStats;
    document.getElementById('userName').textContent = profile.name;
    document.getElementById('userAvatar').src = profile.avatar;
    applySettings();
    renderList();
    updateStats();

    // --- Боковое меню ---
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    // --- Вкладки ---
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    // --- Настройки (сохранение без потери данных) ---
    document.getElementById('togglePrice').onchange = (e) => {
      settings.showPrice = e.target.checked;
      saveSettings(); applySettings();
    };
    document.getElementById('toggleStats').onchange = (e) => {
      settings.showStats = e.target.checked;
      saveSettings(); applySettings();
    };
    function saveSettings() { localStorage.setItem('settings', JSON.stringify(settings)); }
    function applySettings() {
      document.getElementById('statsSection').classList.toggle('hidden', !settings.showStats);
      document.querySelectorAll('.book .price').forEach(el => el.classList.toggle('hidden', !settings.showPrice));
    }

    // --- Профиль ---
    document.getElementById('avatarInput').onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => { profile.avatar = reader.result; document.getElementById('userAvatar').src = reader.result; saveProfile(); };
      reader.readAsDataURL(file);
    };
    function editName() {
      const newName = prompt('Введите имя пользователя:', profile.name);
      if(newName) { profile.name = newName; document.getElementById('userName').textContent = newName; saveProfile(); }
    }
    function saveProfile() { localStorage.setItem('profile', JSON.stringify(profile)); }

    // --- Модалка ---
    function openModal() { 
      document.getElementById('modal').classList.add('open'); 
      clearForm(); 
    }
    function closeModal() { 
      document.getElementById('modal').classList.remove('open'); 
      if(html5QrcodeScanner) html5QrcodeScanner.stop(); 
    }
    function clearForm() {
      ['mIsbn','mTitle','mAuthor','mDesc','mPrice','mCoverUrl'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('mCoverFile').value = '';
      document.getElementById('coverPreview').style.display = 'none';
      coverBase64 = null;
    }

    // --- Сканирование штрих-кода ---
    function startScan() {
      const readerDiv = document.getElementById('reader');
      readerDiv.innerHTML = '';
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250, formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E] });
      html5QrcodeScanner.render(success => {
        document.getElementById('mIsbn').value = success.replace(/[^0-9]/g, '');
        fetchBookData(document.getElementById('mIsbn').value);
        html5QrcodeScanner.stop();
      }, err => console.warn(err));
    }

    // --- Автоподгрузка данных по ISBN (Open Library API) ---
    async function fetchBookData(isbn) {
      if(!isbn || isbn.length < 10) return;
      try {
        const cleanIsbn = isbn.replace(/[^0-9]/g, '');
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${cleanIsbn}&format=json&jscmd=data`);
        const data = await res.json();
        const key = `ISBN:${cleanIsbn}`;
        if(data[key]) {
          const book = data[key];
          if(book.title) document.getElementById('mTitle').value = book.title;
          if(book.authors?.length) document.getElementById('mAuthor').value = book.authors.map(a=>a.name).join(', ');
          if(book.cover?.medium) document.getElementById('mCoverUrl').value = book.cover.medium;
          if(book.notes) document.getElementById('mDesc').value = book.notes;
        }
      } catch(e) { console.log('API недоступно или ISBN не найден'); }
    }

    // --- Превью обложки из файла ---
    function previewCover(input) {
      if(input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { coverBase64 = e.target.result; document.getElementById('coverPreview').src = coverBase64; document.getElementById('coverPreview').style.display = 'block'; };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // --- Сохранение книги ---
    function saveBook() {
      const title = document.getElementById('mTitle').value.trim();
      if(!title) return alert('Введите название книги!');

      const finalCover = coverBase64 || document.getElementById('mCoverUrl').value.trim() || 'https://via.placeholder.com/70x100?text=NoCover';
      
      const book = {
        id: Date.now(),
        isbn: document.getElementById('mIsbn').value.trim(),
        title,
        author: document.getElementById('mAuthor').value.trim(),
        desc: document.getElementById('mDesc').value.trim(),
        price: document.getElementById('mPrice').value || '0',
        cover: finalCover,
        date: new Date().toISOString(),
        inPersonal: currentTab === 'personal'
      };
      
      books.unshift(book);
      localStorage.setItem('books', JSON.stringify(books));
      closeModal();
      renderList();
      updateStats();
    }

    // --- Отрисовка и статистика ---
    function renderList() {
      const list = document.getElementById('bookList');
      list.innerHTML = '';
      const filtered = currentTab === 'personal' ? books.filter(b => b.inPersonal) : books;
      
      if(filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#555; margin-top:50px;">Библиотека пуста. Нажмите + чтобы добавить книгу.</p>';
        return;
      }

      filtered.forEach(b => {
        const priceText = b.price ? `${parseFloat(b.price).toFixed(2)} ₽` : '';
        list.innerHTML += `
          <div class="book">
            <img src="${b.cover}" onerror="this.src='https://via.placeholder.com/70x100?text=Err'">
            <div class="book-info">
              <h3>${b.title}</h3>
              <div class="meta">${b.author || 'Автор не указан'}</div>
              <div class="price ${settings.showPrice ? '' : 'hidden'}">${priceText}</div>
              <div class="desc">${b.desc || ''}</div>
            </div>
          </div>`;
      });
    }
    function updateStats() {
      const total = books.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
      document.getElementById('statCount').textContent = books.length;
      document.getElementById('statSum').textContent = total.toFixed(2) + ' ₽';
    }

    // Регистрация SW
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.error);
  </script>
</body>
</html>
