<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <title>Book Tracker Pro</title>
    <meta name="description" content="Book Tracker Pro — трекер книг для бук-блогера: серии, подборки, челленджи, поиск по ISBN, цитаты по фото, глобальный поиск, извлечение книги по ссылке (Microlink), 8 площадок с Pinterest и Threads. Новое в 3.8.5: read-only карточка контента, FAB-меню, импорт-синхронизация, SVG доп.оценки. Работает полностью оффлайн."/>

    <!-- v3.8.3: CSP -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data: blob: https:;
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com data:;
                   connect-src 'self' https://www.googleapis.com https://openlibrary.org https://covers.openlibrary.org https://api.microlink.io https://pro-api.microlink.io https://catalit.litres.ru https://corsproxy.io https://open.er-api.com https://cv0.litres.ru https://cv1.litres.ru https://cv2.litres.ru https://cv3.litres.ru https://cv4.litres.ru https://cv5.litres.ru https://cv6.litres.ru https://cv7.litres.ru https://cv8.litres.ru https://cv9.litres.ru https://api.litres.ru https://unpkg.com https://cdn.jsdelivr.net;
                   media-src 'self' blob:;
                   worker-src 'self' blob:;"/>

    <meta name="theme-color" content="#161210"/>

    <!-- iOS / Android standalone -->
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="BookTracker"/>
    <link rel="apple-touch-icon" href="icon-192.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
    <link rel="manifest" href="manifest.json"/>

    <!-- Шрифт Nunito (v3.8.4) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

    <link rel="modulepreload" href="utils.js?v=3.8.5"/>
    <link rel="modulepreload" href="icons.js?v=3.8.5"/>
    <link rel="modulepreload" href="uikit.js?v=3.8.5"/>
    <link rel="modulepreload" href="db.js?v=3.8.5"/>
    <link rel="modulepreload" href="microlink.js?v=3.8.5"/>
    <link rel="modulepreload" href="app.js?v=3.8.5"/>
    <link rel="stylesheet" href="app.css?v=3.8.5"/>
    <link rel="stylesheet" href="style.css?v=3.8.5"/>
</head>
<body>
    <a href="#main-content" class="skip-link">Перейти к содержимому</a>

    <div id="app">
        <header class="topbar">
            <button id="menu-btn" class="icon-btn" aria-label="Открыть меню">☰</button>
            <button id="back-btn" class="icon-btn hidden" aria-label="Назад">←</button>
            <h1 id="page-title" class="topbar-title">Мои книги</h1>
            <button id="search-toggle" class="icon-btn" aria-label="Поиск">🔍</button>
        </header>

        <div id="search-bar" class="search-bar hidden">
            <div class="search-input-row">
                <input type="text" id="search-input" placeholder="Поиск по названию, автору, ISBN, тегу..."
                       autocomplete="off" enterkeyhint="search" aria-label="Поиск"/>
                <button id="search-close" class="icon-btn" aria-label="Закрыть поиск">✕</button>
            </div>
            <div id="search-scopes" class="search-scopes"></div>
            <div id="search-book-tags" class="search-book-tags hidden"></div>
            <div id="search-results" class="search-results hidden"></div>
        </div>

        <div id="active-filters" class="active-filters hidden"></div>

        <main id="main-content" class="main-content" role="main">
            <div id="skeleton" class="book-list" aria-hidden="true">
                <div class="book-card"><div class="book-cover skeleton"></div><div class="book-info"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div>
                <div class="book-card"><div class="book-cover skeleton"></div><div class="book-info"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div>
                <div class="book-card"><div class="book-cover skeleton"></div><div class="book-info"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div>
                <div class="book-card"><div class="book-cover skeleton"></div><div class="book-info"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div>
                <div class="book-card"><div class="book-cover skeleton"></div><div class="book-info"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div>
            </div>
        </main>

        <div class="fab-group">
            <button id="scan-btn" class="fab fab-secondary" aria-label="Сканер ISBN">📷</button>
            <button id="add-btn" class="fab fab-primary" aria-label="Добавить">＋</button>
        </div>
    </div>

    <div id="backdrop" class="backdrop"></div>
    <aside id="drawer" class="drawer" role="navigation" aria-label="Главное меню">
        <div class="drawer-header">
            <div class="drawer-logo"></div>
            <div class="drawer-title">Book Tracker Pro</div>
            <button id="drawer-close" class="icon-btn" aria-label="Закрыть меню">✕</button>
        </div>
        <div id="drawer-offline" class="drawer-offline hidden">📴 Оффлайн-режим</div>
        <nav class="drawer-nav">
            <button class="nav-item" data-tab="books"><span class="nav-icon"></span> Мои книги <span class="nav-count" id="nav-count-books"></span></button>
            <button class="nav-item" data-tab="content"><span class="nav-icon"></span> Контент <span class="nav-count" id="nav-count-content"></span></button>
            <button class="nav-item" data-tab="reviews"><span class="nav-icon"></span> Отзывы <span class="nav-count" id="nav-count-reviews"></span></button>
            <button class="nav-item" data-tab="calendar"><span class="nav-icon"></span> Календарь</button>
            <button class="nav-item" data-tab="challenges"><span class="nav-icon"></span> Челленджи <span class="nav-count" id="nav-count-challenges"></span></button>
            <button class="nav-item" data-tab="series"><span class="nav-icon"></span> Серии</button>
            <button class="nav-item" data-tab="collections"><span class="nav-icon"></span> Подборки</button>
            <button class="nav-item" data-tab="stats"><span class="nav-icon"></span> Статистика</button>
            <button class="nav-item" data-tab="settings"><span class="nav-icon"></span> Настройки</button>
        </nav>
        <div class="drawer-section">
            <button id="drawer-title-collections" class="drawer-section-title">📂 Подборки</button>
            <div id="drawer-collections" class="drawer-sub"></div>
            <!-- 🆕 v3.8.5: кнопка «+ Новая подборка» убрана (создание — через FAB «+») -->
        </div>
        <div class="drawer-section">
            <button id="drawer-title-series" class="drawer-section-title">📚 Серии</button>
            <div id="drawer-series" class="drawer-sub"></div>
        </div>
        <div class="drawer-section">
            <button id="drawer-title-filters" class="drawer-section-title">🔍 Фильтры</button>
            <div id="drawer-filters" class="drawer-sub"></div>
        </div>
        <div class="drawer-footer">
            <span id="drawer-version"></span>
        </div>
    </aside>

    <div id="form-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <div class="overlay-panel">
            <div class="overlay-header">
                <button id="form-back" class="overlay-back" aria-label="Назад"></button>
                <h2 id="form-title">Новая книга</h2>
                <button id="form-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div id="form-body" class="overlay-body"></div>
        </div>
    </div>

    <div id="detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div class="overlay-panel">
            <div class="overlay-header">
                <button id="detail-back" class="overlay-back" aria-label="Назад"></button>
                <h2 id="detail-title">Книга</h2>
                <button id="detail-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div id="detail-body" class="overlay-body"></div>
        </div>
    </div>

    <div id="scanner-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Сканер ISBN">
        <div class="overlay-panel scanner-panel">
            <div class="overlay-header">
                <h2>📷 Сканер ISBN</h2>
                <button id="scanner-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div class="overlay-body">
                <div class="scanner-stage">
                    <video id="scanner-video" autoplay playsinline muted></video>
                </div>
                <div id="scanner-status" class="scanner-status">Запуск камеры...</div>
                <div class="scanner-manual">
                    <input type="text" id="scanner-manual-input" placeholder="Или введите ISBN вручную..."
                           inputmode="numeric" aria-label="Ручной ввод ISBN"/>
                    <button id="scanner-manual-btn" class="btn-secondary">Найти</button>
                </div>
            </div>
        </div>
    </div>

    <div id="content-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="content-form-title">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h2 id="content-form-title">Новый контент</h2>
                <button id="content-form-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div id="content-form-body" class="overlay-body"></div>
        </div>
    </div>

    <div id="review-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="review-form-title">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h2 id="review-form-title">Отзыв</h2>
                <button id="review-form-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div id="review-form-body" class="overlay-body"></div>
        </div>
    </div>

    <div id="cover-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Просмотр обложки">
        <div class="overlay-panel cover-viewer-panel">
            <div class="overlay-header">
                <h2 id="cover-viewer-title">Обложка</h2>
                <button id="cover-close" class="icon-btn" aria-label="Закрыть">✕</button>
            </div>
            <div class="overlay-body">
                <div class="cover-viewer">
                    <img id="cover-viewer-img" src="" alt="Обложка книги"/>
                </div>
                <div class="cover-actions">
                    <input type="file" id="cover-photo-input" accept="image/*" capture="environment" class="hidden"/>
                    <input type="file" id="cover-gallery-input" accept="image/*" class="hidden"/>
                    <button id="cover-photo-btn" class="btn-secondary">📷 Заменить фото</button>
                    <button id="cover-gallery-btn" class="btn-secondary">🖼️ Из галереи</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <div id="update-banner" class="pwa-banner hidden">
        <span>🔄 Доступна новая версия</span>
        <button class="btn-small" id="update-apply">Обновить</button>
        <button class="icon-btn" id="update-dismiss" aria-label="Скрыть">✕</button>
    </div>

    <div id="install-banner" class="pwa-banner hidden">
        <span>📱 Установить BookTracker?</span>
        <button class="btn-small" id="install-apply">Установить</button>
        <button class="icon-btn" id="install-dismiss" aria-label="Скрыть">✕</button>
    </div>

    <script type="module" src="app.js?v=3.8.5"></script>
</body>
</html>
